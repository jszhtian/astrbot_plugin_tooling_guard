name: astrbot_plugin_tooling_guard
display_name: Tooling Guard
short_desc: 模型执行高危工具前先判定：放行、拒绝或挂起等人批。
desc: >
  在 AstrBot 的请求钩子里把 shell、python、文件读写、浏览器等受管工具换成代理，
  逐次判定放行、拒绝，或挂起等管理员审批。默认 mode=observe 只审计不阻断；要真正
  拦截需切到 enforce，并先配好 admins。覆盖范围仅限这一个钩子：cron、后台唤醒与
  子 agent 内部的工具调用不在其中。详见 README.md。
version: 0.6.9
author: DSH_Work
repo: ""
astrbot_version: ">=4.29.3"
# Dashboard page entry: the host looks for views/<name>/index.html and shows the
# page only when this key lists the name (pages is the equivalent alias).
views: [guard]
